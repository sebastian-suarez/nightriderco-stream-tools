<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NIGHTRIDERCO · Chat Overlay</title><link rel="icon" href="/assets/emblem.svg" type="image/svg+xml"><link rel="stylesheet" href="/chat.css"></head>
<body class="overlay-page">
  <main class="nrc-chat" data-theme="panel" aria-label="NIGHTRIDERCO chat">
    <header class="chat-cap"><div class="chat-cap-label"><img src="/assets/emblem.svg" alt=""><span data-chat-copy="title">THE COMMUNITY</span></div><span class="chat-cap-state" id="overlay-state" data-state="connecting">CONNECTING</span></header>
    <div class="chat-demo-note" id="demo-note" hidden>DEMO · SAMPLE MESSAGES</div>
    <section id="messages" aria-label="Chat messages" aria-live="off"></section>
    <footer class="chat-foot"><span data-chat-copy="kick">KICK</span><span class="ice" data-chat-copy="ride">YOU ARE PART OF THE RIDE</span></footer>
  </main>
  <script type="module" src="/overlay.js"></script>
</body>
</html>
